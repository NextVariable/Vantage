# Vantage 1.1 — expanded opt-in source profile.
#
# Purpose: exercise the 1.1 structured connectors without changing the
# default Skill run (`config/sources-hybrid.yaml`, 6 slots). Every source is
# capped at one query per run so adding breadth does not multiply default
# research cost. Use explicitly, e.g.
#
#   sourceglint research --registry config/sources-expanded.yaml ...
#
# Sources that need a named public board (lever, greenhouse, ashby), a numeric
# appid (steam), or a country/indicator pair (world_bank) resolve to an empty
# route and record a limitation when the host does not supply those inputs.

- name: host_web_search
  enabled: true
  type: web
  cost: free
  auth_required: false
  credentials: []
  priority: 60
  capabilities: [search]
  rate_limit: { rpm: 30 }
  markets: [global, us, gb, jp, de, fr, kr, cn, in, br]
  languages: [en, ja, zh, de, fr, ko, pt, hi]
  cache_ttl: 900
  max_queries_per_run: 1


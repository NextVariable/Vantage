# --- 1.1 structured expansion (opt-in) -----------------------------------
# These connectors are implemented and offline-tested, but stay disabled in
# the default runtime so a normal run keeps its 1.0 source mix and cost.
# Enable them through config/sources-expanded.yaml or by flipping one entry.

- name: crossref
  enabled: false
  type: official
  cost: free
  auth_required: false
  credentials: []
  priority: 84
  capabilities: [search]
  rate_limit: { rpm: 30 }
  markets: [global]
  languages: [en]
  cache_ttl: 3600
  max_queries_per_run: 1

- name: openalex
  # OPENALEX_API_KEY is optional: it only unlocks cursor paging and a polite
  # pool. Anonymous first-page search works without it, so it is not a

# Native-only registry for reproducible runs and benchmarks.
# Every entry has a connector in this repository, so a run needs no host
# retrieval capability. Host search is intentionally absent.
- name: reddit
  enabled: true
  type: community
  cost: free
  auth_required: false
  credentials: []
  priority: 80
  capabilities:
  - search
  - comments
  rate_limit:
    rpm: 60
  markets:
  - global
  - us
  - gb
  - jp
  - de
  - fr
  - kr
  - cn
  languages:
  - en
  - ja
  - zh
  - de
  - fr
  - ko
  cache_ttl: 900
  max_queries_per_run: 2

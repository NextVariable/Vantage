name: Tests and installed package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src scripts
      - run: python scripts/check_repository.py
      - run: python -m pytest tests -q
      - run: python scripts/verify_wheel_install.py
